permissions:
  contents: write

name: Daily KB Update

on:
  schedule:
    - cron: "0 3 * * *"   # daily 03:00 UTC
  workflow_dispatch:

jobs:
  build-kb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install requests beautifulsoup4 lxml

      - name: Crawl website
        run: |
          python scripts/crawl_site.py

      - name: Build KB
        run: |
          python scripts/build_kb.py

      - name: Commit & Push
        run: |
          git config user.name "kb-bot"
          git config user.email "kb-bot@users.noreply.github.com"
          git add kb/kb_current.jsonl kb/snapshots/web_raw.jsonl
          git commit -m "Daily KB update" || echo "No changes"
          git push
