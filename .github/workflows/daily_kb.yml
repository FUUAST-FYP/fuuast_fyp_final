permissions:
  contents: write

name: Daily KB Update

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build-kb:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Crawl (HTML + PDF links). If crawl fails, we still build KB from curated knowledge_base.json
      - name: Crawl website
        run: |
          python scripts/crawl_site.py --max-pages 500 --timeout 20 --delay 0.20 || echo "Crawl failed — continuing"

      # Extract PDFs with conservative limits for Actions runtime
      - name: Extract PDFs
        run: |
          python scripts/extract_pdfs.py --max-pdfs 40 --timeout 45 --sleep 0.20 --max-mb 25 || echo "PDF extract failed — continuing"

      - name: Build KB
        run: |
          python scripts/build_kb.py

      - name: Rotate KB snapshots
        run: |
          python scripts/rotate_kb.py --keep 7 || true

      - name: Sanity check KB not empty
        run: |
          python - <<'PY'
          import os, sys
          p="kb/kb_current.jsonl"
          if (not os.path.exists(p)) or os.path.getsize(p) < 200:
              print("KB is empty/suspiciously small:", p)
              sys.exit(1)
          print("KB OK:", os.path.getsize(p), "bytes")
          PY

      - name: Commit & Push
        run: |
          git config user.name "kb-bot"
          git config user.email "kb-bot@users.noreply.github.com"
          git add kb/kb_current.jsonl kb/snapshots/kb_*.jsonl scripts/seeds.txt || true
          git commit -m "Daily KB update" || echo "No changes"
          git push
