name: Daily FUUAST KB Update

on:
  schedule:
    - cron: "30 10 * * *"
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests beautifulsoup4

      - name: Crawl and update KB
        run: python scripts/crawl_fuuast.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kb_snapshots kb_current.json kb_manifest.json
          git commit -m "Daily KB update" || echo "No changes"
          git push
