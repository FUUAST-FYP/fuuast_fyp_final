permissions:
  contents: write

name: Build Timetable JSON

on:
  push:
    paths:
      - "data/timetable.xlsx"
      - "scripts/parse_timetable.py"
      - ".github/workflows/build_timetable.yml"
  workflow_dispatch:

jobs:
  build-timetable:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Build timetable.json
        run: |
          python scripts/parse_timetable.py --input "data/timetable.xlsx" --output "data/timetable.json"

      - name: Commit & Push (if changed)
        run: |
          git config user.name "timetable-bot"
          git config user.email "timetable-bot@users.noreply.github.com"

          git add data/timetable.json

          git diff --cached --quiet && echo "No timetable.json changes" && exit 0

          git commit -m "Update timetable.json from timetable.xlsx"

          # avoid non-fast-forward if another workflow pushed recently
          git pull --rebase
          git push
